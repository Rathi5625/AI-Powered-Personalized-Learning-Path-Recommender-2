server:
  port: ${SERVER_PORT}

spring:
  application:
    name: learning-path-recommender
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  llm:
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL}
    base-url: ${LLM_BASE_URL}
    timeout-seconds: 15
  embedding:
    api-key: ${EMBEDDING_API_KEY}
    model: ${EMBEDDING_MODEL}
    base-url: ${EMBEDDING_BASE_URL}
    timeout-seconds: 15
    dimension: 1536
  recommendation:
    max-milestones: 12
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  email:
    smtp-enabled: ${SMTP_ENABLED:false}
  mail:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
  import:
    enabled: ${APP_IMPORT_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
